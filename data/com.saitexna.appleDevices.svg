<?xml version="1.0" encoding="UTF-8"?>
<!-- Иконка приложения: силуэт iPhone с нотой в цветах Apple Music.
     Полноформатная (full-bleed) — оболочка GNOME сама накладывает маску
     «скруглённого квадрата». -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d43"/>
      <stop offset="1" stop-color="#232327"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb5c74"/>
      <stop offset="1" stop-color="#fa233b"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="128" height="128" rx="18" fill="url(#bg)"/>

  <!-- корпус телефона -->
  <rect x="42" y="18" width="44" height="92" rx="9" fill="#f6f5f4"/>
  <rect x="46.5" y="26" width="35" height="76" rx="4" fill="#241f31"/>
  <rect x="57" y="21" width="14" height="2.6" rx="1.3" fill="#c0bfbc"/>
  <rect x="57" y="96.5" width="14" height="2" rx="1" fill="#5e5c64"/>

  <!-- нота -->
  <g fill="url(#note)">
    <ellipse cx="58" cy="78" rx="6.8" ry="5.2" transform="rotate(-18 58 78)"/>
    <rect x="62" y="50" width="3.2" height="28.5" rx="1.2"/>
    <path d="M65.2 50 C 72.5 52, 76.5 57.5, 74.8 65.5 C 73.6 60.5, 70.2 57.8, 65.2 56.6 Z"/>
  </g>
</svg>
